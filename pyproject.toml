[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "profact"
version = "0.1.0"
description = "Protein FASTA analysis and comparison tool"
authors = [
    {name = "Wojciech Laskowski"},
    {name = "Wojciech Moryl"},
    {name = "Karolina Winczewska"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
profact = "profact.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["profact"]
